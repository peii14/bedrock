# Local gates. CI runs the same checks, so skipping a hook only delays the failure.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    file-length:
      run: bun scripts/check-file-length.ts
    secrets:
      run: bunx secretlint --maskSecrets {staged_files}
    gitleaks:
      run: if command -v gitleaks >/dev/null; then gitleaks git --staged --redact --no-banner; else echo "gitleaks not installed, skipped (CI still runs it)"; fi

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    unit-tests:
      run: bun test packages
    audit:
      run: bun audit --audit-level=high
