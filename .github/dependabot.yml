version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directories: [/docker, /docker/nginx]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
