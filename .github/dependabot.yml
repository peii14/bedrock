# bun is left out until Dependabot reads bun.lock v2 (dependabot/dependabot-core#16071).
# Dependency CVEs are still caught by bun audit and OSV in the Security workflow.
version: 2
updates:
  - package-ecosystem: docker
    directories: [/docker, /docker/nginx]
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
