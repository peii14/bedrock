name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - run: ./gitleaks git --redact --no-banner --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan
        run: >
          semgrep scan --metrics off --json --output semgrep.json
          --config p/typescript --config p/nodejs --config p/owasp-top-ten --config p/secrets
          --config .semgrep || true
      - name: Report findings
        run: python3 scripts/ci/report-findings.py semgrep semgrep.json

  dependencies:
    name: Dependencies (bun audit + OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level=high
      - name: OSV scanner
        run: >
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0
          scan source -r /src --format json --output /src/osv.json || true
      - name: Report OSV findings
        run: python3 scripts/ci/report-findings.py osv osv.json

  config:
    name: Docker, compose and nginx config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-config.json
          exit-code: "0"
      - name: Report config findings
        run: python3 scripts/ci/report-findings.py trivy trivy-config.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ !cancelled() }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-fs.json
          exit-code: "0"
      - name: Report filesystem findings
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/report-findings.py trivy trivy-fs.json
