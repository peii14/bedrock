# Edge proxy: TLS, HTTP/2 + HTTP/3, compression, edge rate limits, static asset cache.
# The apps still own auth, security headers and fine grained rate limits.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;

  # Writable temp paths for the read only, non root container.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  reset_timedout_connection on;
  client_max_body_size 10m;
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;
  max_headers 100;
  add_header_inherit merge;

  # Docker's DNS, re-resolved so upstream containers can restart with new IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr",'
    '"upstream_time":"$upstream_response_time","cache":"$upstream_cache_status",'
    '"protocol":"$server_protocol","agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript
    application/xml application/rss+xml application/problem+json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  limit_req_zone $binary_remote_addr zone=req_api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=req_auth:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m
    max_size=1g inactive=7d use_temp_path=off;

  upstream web {
    zone upstream_web 64k;
    server web:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream api {
    zone upstream_api 64k;
    server api:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
