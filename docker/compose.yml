name: starter

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
  REDIS_URL: redis://valkey:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL}
  WEB_ORIGIN: ${PUBLIC_URL}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  PASSWORD_PEPPERS: ${PASSWORD_PEPPERS:?set PASSWORD_PEPPERS}
  PASSWORD_PEPPER_CURRENT: ${PASSWORD_PEPPER_CURRENT:?set PASSWORD_PEPPER_CURRENT}

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: [/tmp]

services:
  nginx:
    build: { context: .., dockerfile: docker/nginx/Dockerfile }
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /var/run, /var/cache/nginx, /etc/nginx/conf.d, /etc/nginx/certs]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    depends_on: [web, api]

  # Issues and renews the Let's Encrypt certificate. Enable with: docker compose --profile tls up -d
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [tls]
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
      certbot certonly --webroot -w /var/www/acme -d "$$SERVER_NAME" --email "$$ACME_EMAIL"
      --agree-tos --no-eff-email --keep-until-expiring --non-interactive || true;
      sleep 12h & wait $$!; done'
    depends_on: [nginx]

  web:
    <<: *hardening
    build: { context: .., dockerfile: docker/web.Dockerfile }
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *hardening
    build: { context: .., dockerfile: docker/api.Dockerfile, target: api }
    environment: *api-env
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 10s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  migrate:
    build: { context: .., dockerfile: docker/api.Dockerfile, target: migrate }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  letsencrypt:
  acme-webroot:
